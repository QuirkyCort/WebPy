<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Deal with SharedArrayBuffer header requirements -->
  <script src="mini-coi.js"></script>

  <link rel="stylesheet" href="css/main.css?v=56730451">
  <link rel="stylesheet" href="css/widgets.css?v=bd03d9dc">

  <script src="jquery/jquery-3.6.1.slim.min.js"></script>

  <script src="jszip-3.10.1/jszip.min.js"></script>

  <script src="xterm-6.0.0/addon-fit.js"></script>

  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <script src="js/common/widgets.js?v=8de59276"></script>
  <script src="js/common/utilities.js?v=436f2027"></script>

  <title>WebPy</title>
</head>

<body>

  <main>
    <nav>
      <ul class="panelTabs">
        <li id="navPython" class="active">Python</li>
        <li id="navTerminal">Terminal</li>
      </ul>

      <div class="menuBar">
        <div class="menuItem fileMenu">File</div>
        <div class="menuItem viewMenu">View</div>
        <div class="menuItem helpMenu">Help</div>
      </div>
    </nav>

    <div class="panels">

      <div class="panel active" aria-labelledby="navPython">
        <div class="python">
          <div id="monaco-editor" style="width:100%; height:100%;"></div>
          <div id="filesRow">
            <div id="filesList"></div>
            <div id="addNewFile"><span class="icon-plus"></span></div>
          </div>
        </div>
      </div>

      <div class="panel" aria-labelledby="navTerminal">
        <div class="terminal">
          <div class="terminalRow">
            <button id="terminalRun" disabled>Run</button>
            <span id="terminalStatus"></span>
          </div>
          <div id="terminalDisplay"></div>
        </div>
      </div>

    </div>
  </main>

  <script src="monaco-0.57.0/main.bundle.js"></script>

  <script src="js/pythonPanel.js?v=7b0e7e4a"></script>
  <script src="js/filesManager.js?v=a7d95d8d"></script>
  <script src="js/terminalPanel.js?v=10a10ee6"></script>
  <script src="js/pyscript.js"></script>

  <script src="js/main.js?v=38177f2e"></script>

</body>
</html>
